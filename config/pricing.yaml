# =============================================================================
# LLM pricing and rate limits
# =============================================================================
# Prices are list prices in USD per 1 million tokens. On a free tier you are
# not billed, but tracking list-price cost tells you what the pipeline and
# agent WOULD cost in production, which is the number a buyer cares about.
#
# Prices change. Verify before reporting numbers:
#   Groq:   https://groq.com/pricing
#   Gemini: https://ai.google.dev/gemini-api/docs/pricing
# Last checked: 2026-10-01
# =============================================================================

models:
  openai/gpt-oss-120b:
    input_per_million: 0.15
    output_per_million: 0.60
  openai/gpt-oss-20b:
    input_per_million: 0.075
    output_per_million: 0.30
  qwen/qwen3.8-27b:
    input_per_million: 0.80     # approximate, verify on groq.com/pricing
    output_per_million: 4.00
  gemini-2.5-flash:
    input_per_million: 0.30
    output_per_million: 2.50    # Gemini bills thinking tokens at the output rate
  meta-llama/llama-prompt-guard-2-86m:
    input_per_million: 0.04     # injection classifier (Preview model on Groq)
    output_per_million: 0.04

  # Local models (Ollama) have no API bill. Add any you run, priced at 0:
  # llama3.1:8b:
  #   input_per_million: 0
  #   output_per_million: 0

# Used for any model not listed above, so cost is never silently zero
default:
  input_per_million: 1.00
  output_per_million: 4.00

# Rate limits for YOUR account tier. These drive the wait timer.
# Groq applies limits PER MODEL, and each model gets its own wait window.
# A provider entry (groq, gemini) is the default for any model not listed.
# Add a model-specific entry to override it, using the limits shown in
# your Groq console for that model.
rate_limits:
  groq:
    tokens_per_minute: 8000     # from the 429 error message on the free tier
    requests_per_minute: 30
  openai/gpt-oss-120b:
    tokens_per_minute: 8000     # confirmed by the 429 error on the free tier
    requests_per_minute: 30
  meta-llama/llama-prompt-guard-2-86m:
    tokens_per_minute: 15000    # free tier, per published limits (Sept 2026)
    requests_per_minute: 30
  gemini:
    tokens_per_minute: 250000
    requests_per_minute: 10     # conservative free-tier value; set to your tier
